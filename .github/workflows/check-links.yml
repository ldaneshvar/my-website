# ─────────────────────────────────────────────────────────────────
# Broken Link Checker
#
# Crawls every link on the live site and fails the workflow if any
# are broken (404s, dead PDFs, etc.). GitHub emails the repo owner
# automatically when a workflow fails.
# ─────────────────────────────────────────────────────────────────

name: Check links

# When should this run?
on:
  # Every Monday at 9am Pacific (16:00 UTC)
  schedule:
    - cron: '0 16 * * 1'

  # Allows manual triggering from the GitHub Actions tab
  workflow_dispatch:

# What steps should happen?
jobs:
  link-check:
    name: Check for broken links
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check links with Lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --verbose
            --no-progress
            --accept 200,429,999
            'https://lidiadaneshvar.com'
            'https://lidiadaneshvar.com/now'
          fail: true
